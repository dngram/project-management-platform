<h2>Projects</h2>

<table border="1">

    <thead>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Description</th>

            <th>Created</th>

            <th>Action</th>

        </tr>

    </thead>

    <tbody>

        <tr
            *ngFor="let project of projects">

            <td>
                {{ project.id }}
            </td>

            <td>
                {{ project.name }}
            </td>

            <td>
                {{ project.description }}
            </td>

            <td>
                {{ project.createdAt }}
            </td>

            <td>

                <button
                    (click)="startEdit(project)">

                    Edit

                </button>

                <button
                    (click)="deleteProject(project.id)">

                    Delete

                </button>

            </td>

        </tr>

    </tbody>

</table>

<h2>Create Project</h2>

<input
    type="text"
    placeholder="Project Name"
    [(ngModel)]="name">

<br><br>

<textarea
    placeholder="Description"
    [(ngModel)]="description">
</textarea>

<br><br>

<button
  *ngIf="editingProjectId === null"
  (click)="createProject()">

  Create Project

</button>

<button
  *ngIf="editingProjectId !== null"
  (click)="updateProject()">

  Update Project

</button>

<hr>
