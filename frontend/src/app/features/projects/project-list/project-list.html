<div class="projects-container">

    <h2>📁 Projects</h2>

    <div class="projects-table">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Description</th>

                    <th>Created</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

                <tr
                    *ngFor="let project of projects">

                    <td>
                        {{ project.id }}
                    </td>

                    <td>
                        {{ project.name }}
                    </td>

                    <td>
                        {{ project.description }}
                    </td>

                    <td>
                        {{ project.createdAt | date:'dd MMM yyyy' }}
                    </td>

                    <td>

                        <div class="action-buttons">

                            <button
                                class="edit-btn"
                                (click)="startEdit(project)">

                                Edit

                            </button>

                            <button
                                class="delete-btn"
                                (click)="deleteProject(project.id)">

                                Delete

                            </button>

                        </div>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <div class="project-form">

        <h2>

            {{ editingProjectId
                ? 'Update Project'
                : 'Create Project' }}

        </h2>

        <input
            type="text"
            placeholder="Project Name"
            [(ngModel)]="name">

        <textarea
            placeholder="Description"
            [(ngModel)]="description">
        </textarea>

        <button
            *ngIf="editingProjectId === null"
            (click)="createProject()">

            Create Project

        </button>

        <button
            *ngIf="editingProjectId !== null"
            (click)="updateProject()">

            Update Project

        </button>

    </div>

</div>
