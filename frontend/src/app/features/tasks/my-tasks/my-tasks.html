<h2>My Tasks</h2>

<table border="1">

  <thead>

    <tr>

      <th>ID</th>

      <th>Title</th>

      <th>Description</th>

      <th>Status</th>

      <th>Project</th>

    </tr>

  </thead>

  <tbody>

    <tr
      *ngFor="let task of tasks">

      <td>
        {{ task.id }}
      </td>

      <td>
        {{ task.title }}
      </td>

      <td>
        {{ task.description }}
      </td>

      <td>
        {{ task.status }}
      </td>

      <td>
        {{ task.projectName }}
      </td>

    </tr>

  </tbody>

</table>
