<div class="dashboard-container">

    <h1>
        Project Management Platform
    </h1>

    <div class="user-info">

        <p>
            Welcome,
            <strong>{{ username }}</strong>
        </p>

        <p>
            Role:
            <strong>{{ role }}</strong>
        </p>

    </div>

    <hr>

    <div class="navigation">

        <button routerLink="/projects">
            Projects
        </button>

        <button routerLink="/tasks">
            Tasks
        </button>

        <button routerLink="/notifications">
            Notifications
        </button>
        
        <button routerLink="/my-tasks">
            My Tasks
        </button>

    </div>

    <hr>

    <button
        class="logout-btn"
        (click)="logout()">

        Logout

    </button>

</div>
