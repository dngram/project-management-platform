<h2>Login</h2>

<input
  type="email"
  placeholder="Email"
  [(ngModel)]="email">

<br><br>

<input
  type="password"
  placeholder="Password"
  [(ngModel)]="password">

<br><br>

<button (click)="login()">
  Login
</button>

<p>
  Don't have an account?
  <a routerLink="/register">
    Register
  </a>
</p>

<p>
  <a routerLink="/forgot-password">
    Forgot Password?
  </a>
</p>
